<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with webop...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; color: #94a3b8; margin: 0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Connecting your account...</h2>
  <p>Completing webop verification. This window will close automatically.</p>

  <script>
    async function handleOAuthCallback() {
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.substring(1));

      const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
      const code = searchParams.get('code');
      const state = searchParams.get('state') || hashParams.get('state') || '';
      const error = searchParams.get('error') || hashParams.get('error');

      if (error) {
        if (window.opener) {
          window.opener.postMessage({ type: 'OAUTH_AUTH_ERROR', error }, '*');
          window.close();
        }
        return;
      }

      let provider = state.includes('discord') ? 'discord' : 'google';
      let userInfo = null;

      if (accessToken) {
        try {
          if (provider === 'discord') {
            const res = await fetch('https://discord.com/api/users/@me', {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (res.ok) {
              const data = await res.json();
              userInfo = {
                id: data.id,
                name: data.global_name || data.username,
                username: data.username,
                email: data.email || `${data.username}@discord.gg`,
                avatar: data.avatar
                  ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png`
                  : 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&auto=format&fit=crop&q=80',
                provider: 'discord'
              };
            }
          } else {
            // Google
            const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (res.ok) {
              const data = await res.json();
              userInfo = {
                id: data.sub,
                name: data.name,
                username: (data.email ? data.email.split('@')[0] : data.name).toLowerCase().replace(/[^a-z0-9_]/g, ''),
                email: data.email,
                avatar: data.picture,
                provider: 'google'
              };
            }
          }
        } catch (e) {
          console.error('Error fetching userinfo in callback:', e);
        }
      }

      if (window.opener) {
        window.opener.postMessage({
          type: 'OAUTH_AUTH_SUCCESS',
          provider,
          accessToken,
          code,
          user: userInfo
        }, '*');
        setTimeout(() => window.close(), 300);
      } else {
        window.location.href = '/';
      }
    }

    handleOAuthCallback();
  </script>
</body>
</html>
